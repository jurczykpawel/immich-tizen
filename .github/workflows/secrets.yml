name: Secret scan

# Scans the whole git history with TruffleHog (built-in detectors plus the Immich key detector from .trufflehog.yaml)
# on every push and pull request, and once a week in case detectors learn about new key formats.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install TruffleHog (pinned)
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/v3.99.9/scripts/install.sh | sh -s -- -b /usr/local/bin v3.99.9
      - name: Scan history
        run: trufflehog git file://. --no-update --fail --config .trufflehog.yaml --results=verified,unverified
