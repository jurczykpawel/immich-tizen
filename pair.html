<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Immich TV: konfiguracja</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #667; --accent: #2a7de1; --field: #f1f3f6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0d12; --fg: #f2f4f8; --muted: #9aa3b5; --field: #1a1f2b; } }
  body { margin: 0; padding: 24px 16px; font: 17px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 14px; font-size: 17px; border: 0; border-radius: 10px; background: var(--field); color: var(--fg); }
  button { width: 100%; margin-top: 24px; padding: 16px; font-size: 18px; font-weight: 600; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
  #status { margin-top: 16px; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <h1>Połącz telewizor z Immich</h1>
  <p>Dane są szyfrowane kluczem z telewizora, więc nikt po drodze ich nie odczyta.</p>
  <form id="pair-form" autocomplete="off">
    <label for="address">Adres serwera Immich</label>
    <input id="address" name="address" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="192.168.1.10:2283">
    <label for="key">Klucz API</label>
    <input id="key" name="key" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="wklej klucz">
    <button type="submit">Wyślij do telewizora</button>
  </form>
  <div id="status" role="status"></div>
</main>
<script type="module" src="/src/phone.ts"></script>
</body>
</html>
